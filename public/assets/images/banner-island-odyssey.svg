<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    <defs>
      <linearGradient id="bgrad_island-odyssey" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#0d9488" stop-opacity="0.95" />
      </linearGradient>
      <radialGradient id="bglow_island-odyssey" cx="65%" cy="40%" r="55%">
        <stop offset="0%" stop-color="#fb923c" stop-opacity="0.4" />
        <stop offset="100%" stop-color="#081717" stop-opacity="0" />
      </radialGradient>
      <pattern id="bgrid_island-odyssey" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#081717" />
    <rect width="100%" height="100%" fill="url(#bgrid_island-odyssey)" />
    <circle cx="620" cy="240" r="240" fill="url(#bglow_island-odyssey)" />

    <!-- Abstract polygons -->
    <polygon points="50,40 280,20 180,200" fill="#14b8a6" opacity="0.18" />
    <polygon points="700,320 920,440 650,520" fill="#0d9488" opacity="0.25" />
    <polygon points="800,80 940,160 840,240" fill="#fb923c" opacity="0.15" />

    <!-- Big Center Emblem -->
    <circle cx="640" cy="240" r="130" fill="url(#bgrad_island-odyssey)" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
    <text x="640" y="270" font-size="110" text-anchor="middle" dominant-baseline="middle">🏝️</text>

    <!-- Dark gradient overlay for text legibility -->
    <rect width="520" height="540" fill="linear-gradient(90deg, #081717 80%, transparent)" />
    
    <!-- Title Info in banner -->
    <rect x="50" y="160" width="130" height="28" rx="14" fill="#fb923c" opacity="0.2" stroke="#fb923c" stroke-width="1.5"/>
    <text x="115" y="179" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="12" fill="#fb923c" text-anchor="middle" letter-spacing="1.5">ADVENTURE • HIT GAME</text>

    <text x="50" y="245" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="1">Isle of Wonders</text>
    
    <text x="50" y="290" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#94a3b8" letter-spacing="0.5">Experience next-gen browser action with silky smooth 60 FPS.</text>
    <text x="50" y="318" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#94a3b8" letter-spacing="0.5">Instant play. No downloads or installations required.</text>

    <!-- Rating Stars -->
    <text x="50" y="370" font-size="18" fill="#ffd700">★★★★★</text>
    <text x="140" y="369" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">4.9 / 5.0 (3.8k+ reviews)</text>
  </svg>