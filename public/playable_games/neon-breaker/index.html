<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Brick Breaker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #080912;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 800px;
      max-height: 600px;
      background: radial-gradient(circle at 50% 30%, #151a30 0%, #06070d 100%);
      border: 2px solid rgba(255, 0, 127, 0.3);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.2);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(13, 16, 27, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 0, 127, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      color: #ff007f;
    }
    .hud-box span { color: #fff; margin-left: 5px; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 9, 18, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    h1 {
      font-size: 36px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ff007f, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      max-width: 420px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn-play {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      padding: 14px 36px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-play:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.7);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div class="hud-box">SCORE: <span id="score">0</span></div>
      <div class="hud-box">LIVES: <span id="lives">❤❤❤</span></div>
      <div class="hud-box">LEVEL: <span id="level">1</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="startScreen" class="overlay">
      <h1>Neon Brick Breaker</h1>
      <p>Deflect the energy sphere to shatter cyber bricks. Move paddle with your mouse, finger, or arrow keys!</p>
      <button class="btn-play" id="startBtn">LAUNCH BALL</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <h1 id="overTitle" style="background: linear-gradient(135deg, #ff007f, #ff3366); -webkit-background-clip: text;">SYSTEM DISCHARGE</h1>
      <p>Final Score: <strong id="finalScore" style="color:#00f0ff">0</strong></p>
      <button class="btn-play" id="restartBtn">RETRY LEVEL</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const levelEl = document.getElementById('level');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const overTitle = document.getElementById('overTitle');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let animationId;
    let isPlaying = false;
    let score = 0;
    let lives = 3;
    let level = 1;

    // Web Audio Sound Synth
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function beep(freq, duration = 0.08, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    resize();

    const paddle = {
      width: 120,
      height: 14,
      x: 0,
      y: 0,
      speed: 8
    };

    const ball = {
      x: 0,
      y: 0,
      radius: 8,
      dx: 4,
      dy: -4,
      speed: 5
    };

    let bricks = [];
    let particles = [];
    const BRICK_ROWS = 5;
    const BRICK_COLS = 8;
    const BRICK_COLORS = ['#ff007f', '#00f0ff', '#7928ca', '#39ff14', '#ffd700'];

    function createBricks() {
      bricks = [];
      const padding = 10;
      const topOffset = 70;
      const brickWidth = (canvas.width - (BRICK_COLS + 1) * padding) / BRICK_COLS;
      const brickHeight = 22;

      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          bricks.push({
            x: c * (brickWidth + padding) + padding,
            y: r * (brickHeight + padding) + topOffset,
            width: brickWidth,
            height: brickHeight,
            color: BRICK_COLORS[r % BRICK_COLORS.length],
            alive: true
          });
        }
      }
    }

    function resetPositions() {
      paddle.x = canvas.width / 2 - paddle.width / 2;
      paddle.y = canvas.height - 35;
      ball.x = canvas.width / 2;
      ball.y = paddle.y - ball.radius - 2;
      const angle = (Math.random() * 0.6 + 0.2) * (Math.random() > 0.5 ? 1 : -1);
      ball.dx = ball.speed * Math.sin(angle);
      ball.dy = -ball.speed * Math.cos(angle);
    }

    function addParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          radius: Math.random() * 3 + 1,
          color,
          alpha: 1
        });
      }
    }

    // Controls
    let leftPressed = false;
    let rightPressed = false;
    window.addEventListener('keydown', e => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) leftPressed = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) rightPressed = true;
    });
    window.addEventListener('keyup', e => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) leftPressed = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) rightPressed = false;
    });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      paddle.x = e.clientX - rect.left - paddle.width / 2;
    });

    canvas.addEventListener('touchmove', e => {
      if (e.touches.length > 0) {
        const rect = canvas.getBoundingClientRect();
        paddle.x = e.touches[0].clientX - rect.left - paddle.width / 2;
      }
    });

    function update() {
      // Move paddle with keys
      if (leftPressed) paddle.x -= paddle.speed;
      if (rightPressed) paddle.x += paddle.speed;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

      // Move ball
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Ball wall bounce
      if (ball.x - ball.radius < 0) {
        ball.x = ball.radius;
        ball.dx = -ball.dx;
        beep(480);
      } else if (ball.x + ball.radius > canvas.width) {
        ball.x = canvas.width - ball.radius;
        ball.dx = -ball.dx;
        beep(480);
      }

      if (ball.y - ball.radius < 0) {
        ball.y = ball.radius;
        ball.dy = -ball.dy;
        beep(480);
      }

      // Ball paddle collision
      if (
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <= paddle.y + paddle.height &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.width
      ) {
        const hitOffset = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
        ball.dx = hitOffset * ball.speed * 1.2;
        ball.dy = -Math.abs(ball.dy);
        beep(600, 0.06, 'triangle');
      }

      // Ball brick collision
      let allCleared = true;
      for (let b of bricks) {
        if (!b.alive) continue;
        allCleared = false;
        if (
          ball.x + ball.radius > b.x &&
          ball.x - ball.radius < b.x + b.width &&
          ball.y + ball.radius > b.y &&
          ball.y - ball.radius < b.y + b.height
        ) {
          b.alive = false;
          ball.dy = -ball.dy;
          score += 20;
          scoreEl.textContent = score;
          addParticles(b.x + b.width / 2, b.y + b.height / 2, b.color);
          beep(750, 0.08, 'square');
          break;
        }
      }

      // Level Cleared
      if (allCleared) {
        level++;
        levelEl.textContent = level;
        ball.speed += 0.5;
        createBricks();
        resetPositions();
        beep(900, 0.3, 'sine');
      }

      // Ball drop out of bottom
      if (ball.y > canvas.height + 20) {
        lives--;
        livesEl.textContent = '❤'.repeat(Math.max(0, lives));
        beep(180, 0.25, 'sawtooth');
        if (lives <= 0) {
          handleGameOver(false);
          return;
        } else {
          resetPositions();
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Bricks
      bricks.forEach(b => {
        if (!b.alive) return;
        ctx.save();
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.width, b.height, 4);
        ctx.fill();
        ctx.restore();
      });

      // Paddle
      ctx.save();
      ctx.fillStyle = '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 7);
      ctx.fill();
      ctx.restore();

      // Ball
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function gameLoop() {
      if (!isPlaying) return;
      update();
      draw();
      animationId = requestAnimationFrame(gameLoop);
    }

    function handleGameOver(won) {
      isPlaying = false;
      cancelAnimationFrame(animationId);
      finalScoreEl.textContent = score;
      overTitle.textContent = won ? "VICTORY ACHIEVED" : "SYSTEM DISCHARGE";
      gameOverScreen.classList.remove('hidden');
    }

    function startNewGame() {
      resize();
      score = 0;
      lives = 3;
      level = 1;
      scoreEl.textContent = '0';
      livesEl.textContent = '❤❤❤';
      levelEl.textContent = '1';
      createBricks();
      resetPositions();
      isPlaying = true;
      gameLoop();
    }

    startBtn.addEventListener('click', () => {
      startScreen.classList.add('hidden');
      startNewGame();
    });

    restartBtn.addEventListener('click', () => {
      gameOverScreen.classList.add('hidden');
      startNewGame();
    });
  </script>
</body>
</html>
